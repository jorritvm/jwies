[project]
name = "jwies-server"
version = "0.2.0"
description = "Headless lobbyserver voor Vlaamse wies - websockets en JSON"
requires-python = ">=3.13"
dependencies = [
    "jwies-core",
    "jwies-protocol",
    "jwies-assets",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyyaml>=6.0",
]

[project.scripts]
jwies-server = "jwies_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jwies_server"]
