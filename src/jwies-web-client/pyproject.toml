[project]
name = "jwies-web-client"
version = "0.2.0"
description = "Browserclient voor Vlaamse wies - statische HTML, CSS en JavaScript"
requires-python = ">=3.13"
# Geen afhankelijkheden: dit pakket bevat geen Python-logica, enkel de
# statische bestanden van de webclient. De browser is de runtime.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jwies_web_client"]
