[project]
name = "jwies-core"
version = "0.2.0"
description = "Zuivere spelregels en puntentelling voor Vlaamse wies - geen I/O, geen GUI"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jwies_core"]
