[project]
name = "jwies-qt-client"
version = "0.2.0"
description = "PyQt6-client voor Vlaamse wies - tekent enkel wat de server stuurt"
requires-python = ">=3.13"
dependencies = [
    "jwies-protocol",
    "jwies-assets",
    "pyqt6>=6.9.1",
    "pyyaml>=6.0",
]

[project.scripts]
jwies = "jwies_qt_client.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jwies_qt_client"]
