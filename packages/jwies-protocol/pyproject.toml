[project]
name = "jwies-protocol"
version = "0.2.0"
description = "Berichtenschema tussen jwies-server en de clients - enkel pydantic, geen spellogica"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jwies_protocol"]
