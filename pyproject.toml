# Not a uv project: jwies-server, jwies-qt-client and jwies-web-client are each
# fully independent uv projects with their own venv and lockfile (see their own
# pyproject.toml). This file exists only to give bump-my-version one place to
# keep the four components on the same version number and git tag.
[tool.bumpversion]
current_version = "0.2.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = true
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
commit_args = ""

[[tool.bumpversion.files]]
filename = "pyproject.toml"

[[tool.bumpversion.files]]
filename = "jwies-server/pyproject.toml"

[[tool.bumpversion.files]]
filename = "jwies-web-client/pyproject.toml"

[[tool.bumpversion.files]]
filename = "jwies-qt-client/pyproject.toml"
