# =============================================================================
#  jwies - puntentelling "Schaal B" (grote schaal, o.a. de Sporza-versie)
#
#  Zie hoofdstuk 7.3 van docs/game_rules.md. Het verschil met Schaal A zit niet
#  alleen in de bedragen: hier is de tabelwaarde het TOTAAL dat de aanvaller
#  wint, verdeeld over de drie tegenstanders (betaling_solospel: gedeeld).
# =============================================================================

# Versie van het bestandsformaat. Niet met de hand wijzigen.
# Toegelaten waarden: 1
schema_versie: 1

# Naam die spelers te zien krijgen bij het chatcommando !counting.
naam: "Schaal B - grote schaal"

# Hoe wordt een contract van een speler tegen drie afgerekend?
# Toegelaten waarden:
#   per_tegenstander - elke tegenstander betaalt het volledige bedrag (Schaal A)
#   gedeeld          - het bedrag wordt over de drie tegenstanders verdeeld
betaling_solospel: gedeeld

# Kost een mislukt contract het dubbele van wat het opgebracht zou hebben?
# Toegelaten waarden: true, false
verliezen_is_dubbel: false

# Verdubbelt de inzet van de volgende ronde wanneer iedereen past?
# Toegelaten waarden: true, false
iedereen_past_verdubbelt: true

# Per contract gelden vier waarden:
#   basis            - punten wanneer het contract exact gehaald wordt
#   per_overslag     - extra punten per slag boven het beloofde aantal (0 = geen)
#   per_slag_tekort  - punten die per ontbrekende slag betaald worden
#                      (weglaten = gebruik dezelfde waarde als 'basis')
#   alle_dertien     - vaste waarde wanneer alle 13 slagen gehaald worden
#                      (weglaten = gewoon basis + per_overslag toepassen)
contracten:

  # Vragen en meegaan: 2 punten, +1 per extra slag, 14 bij alle 13.
  alliance:
    basis: 2
    per_overslag: 1
    per_slag_tekort: 2
    alle_dertien: 14

  # Alleen gaan: 2 punten, +1 per extra slag, 60 bij alle 13.
  alone:
    basis: 2
    per_overslag: 1
    per_slag_tekort: 2
    alle_dertien: 60

  # Troel: 4 punten, +2 per extra slag, 28 bij alle 13.
  troel:
    basis: 4
    per_overslag: 2
    per_slag_tekort: 4
    alle_dertien: 28

  # Abondance 9 slagen.
  abondance_9:
    basis: 15
    per_overslag: 0

  # Abondance in troef: 9 slagen in de geblekte troef.
  abondance_9_trump:
    basis: 15
    per_overslag: 0

  # Abondance 10 slagen.
  abondance_10:
    basis: 19
    per_overslag: 0

  # Abondance 11 slagen.
  abondance_11:
    basis: 23
    per_overslag: 0

  # Abondance 12 slagen.
  abondance_12:
    basis: 27
    per_overslag: 0

  # Miserie: geen enkele slag halen, zonder troef.
  misere:
    basis: 21
    per_overslag: 0

  # Miserie op tafel: geen enkele slag halen, met open kaarten.
  misere_ouverte:
    basis: 42
    per_overslag: 0

  # Solo: alle 13 slagen in een zelfgekozen troef.
  solo:
    basis: 75
    per_overslag: 0

  # Solo slim: alle 13 slagen in de geblekte troef.
  solo_slim:
    basis: 90
    per_overslag: 0
