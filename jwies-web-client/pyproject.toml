[project]
name = "jwies-web-client"
version = "0.2.0"
description = "Browserclient voor Vlaamse wies, met een eigen webserver"
requires-python = ">=3.13"
dependencies = [
    # Enkel om de statische bestanden uit te serveren. Dit pakket kent de
    # spelregels niet en praat zelf nooit met de spelserver.
    "starlette>=0.40",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
jwies-web = "jwies_web_client.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jwies_web_client"]

[tool.ruff]
extend = "../ruff.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
