# =============================================================================
#  jwies - puntentelling "Schaal A" (kleine schaal, per tegenstander)
#
#  Dit is de schaal die in veel kaartclubs gebruikt wordt. Zie hoofdstuk 7.2
#  van docs/game/rules.md.
#
#  De punten zijn een nulsomspel: wat de winnaars krijgen, betalen de
#  verliezers. De som van alle puntenverschillen in een ronde is altijd nul.
# =============================================================================

# Versie van het bestandsformaat. Niet met de hand wijzigen.
# Toegelaten waarden: 1
schema_versie: 1

# Naam die spelers te zien krijgen bij het chatcommando !counting.
naam: "Kaartclubs schaal"

# Hoe wordt een contract van een speler tegen drie afgerekend?
# Toegelaten waarden:
#   per_tegenstander - elke tegenstander betaalt het volledige bedrag,
#                      de aanvaller wint dus drie keer de waarde (Schaal A)
#   gedeeld          - het bedrag wordt over de drie tegenstanders verdeeld
#                      (Schaal B, waar de tabelwaarden al het totaal zijn)
betaling_solospel: per_tegenstander

# Kost een mislukt contract het dubbele van wat het opgebracht zou hebben?
# Toegelaten waarden: true, false
verliezen_is_dubbel: false

# Verdubbelt de inzet van de volgende ronde wanneer iedereen past?
# Werkt enkel wanneer de regelset 'iedereen_past: volgende_ronde_dubbel' heeft.
# Toegelaten waarden: true, false
iedereen_past_verdubbelt: true

# Per contract gelden vier waarden:
#   basis            - punten wanneer het contract exact gehaald wordt
#   per_overslag     - extra punten per slag boven het beloofde aantal (0 = geen)
#   per_slag_tekort  - punten die per ontbrekende slag betaald worden
#                      (weglaten = gebruik dezelfde waarde als 'basis')
#   alle_dertien     - vaste waarde wanneer alle 13 slagen gehaald worden
#                      (weglaten = gewoon basis + per_overslag toepassen)
contracten:

  # Vragen en meegaan: twee spelers beloven samen 8 slagen.
  alliance:
    basis: 2
    per_overslag: 1
    per_slag_tekort: 2
    alle_dertien: 14

  # Alleen gaan: een speler belooft 5 (of 6) slagen in de geblekte troef.
  alone:
    basis: 2
    per_overslag: 1
    per_slag_tekort: 2
    alle_dertien: 14

  # Troel: twee spelers beloven samen 8 (of 9) slagen.
  troel:
    basis: 4
    per_overslag: 2
    per_slag_tekort: 4
    alle_dertien: 28

  # Abondance: 9 slagen alleen, in een zelfgekozen troef.
  abondance_9:
    basis: 5
    per_overslag: 0
    per_slag_tekort: 0

  # Abondance in troef: 9 slagen alleen, in de geblekte troef.
  abondance_9_trump:
    basis: 5
    per_overslag: 0
    per_slag_tekort: 0

  # Abondance 10 slagen.
  abondance_10:
    basis: 5
    per_overslag: 0
    per_slag_tekort: 0

  # Abondance 11 slagen.
  abondance_11:
    basis: 5
    per_overslag: 0
    per_slag_tekort: 0

  # Abondance 12 slagen.
  abondance_12:
    basis: 5
    per_overslag: 0
    per_slag_tekort: 0

  # Miserie: geen enkele slag halen, zonder troef.
  misere:
    basis: 5
    per_overslag: 0
    per_slag_tekort: 0

  # Miserie op tafel: geen enkele slag halen, met open kaarten.
  misere_ouverte:
    basis: 10
    per_overslag: 0
    per_slag_tekort: 0

  # Solo: alle 13 slagen in een zelfgekozen troef.
  solo:
    basis: 20
    per_overslag: 0
    per_slag_tekort: 0

  # Solo slim: alle 13 slagen in de geblekte troef.
  solo_slim:
    basis: 20
    per_overslag: 0
    per_slag_tekort: 0
